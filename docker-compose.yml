services:
  fastapi:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      #- postgres
      - redis
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

